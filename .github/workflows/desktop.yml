name: desktop

# Windows/Linux app (desktop/) and the prompts and fixtures it shares with the
# Mac app (shared/). Free on a public repository.
on:
  push:
    paths: ["desktop/**", "shared/**", "Sources/MimirCore/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "shared/**", "Sources/MimirCore/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Prompts are LF on this checkout
        shell: bash
        run: "! grep -rl $'\\r' ../shared/prompts"
      - run: cargo test -p mimir-core

  # Editing shared/ for Windows must not silently change the Mac app.
  mac-shared:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests for shared prompts and fixtures
        run: swift test --filter "SharedPromptTests|SharedFixtureTests"

  # The Windows app: unit tests, the NSIS installer, and a self-test that
  # downloads the base model and transcribes the bundled clip. On a tag
  # desktop-v* or by hand, the installer goes to a prerelease for testers.
  # Whether the Windows app needs a build: a Swift-only change under
  # Sources/MimirCore runs the shared checks above, not a full installer build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "desktop/**"
              - "shared/**"
              - ".github/workflows/desktop.yml"

  windows-app:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/desktop/ci/portable-cpu.cmake
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - run: cargo test -p mimir-app
      - name: Build the installer
        working-directory: desktop/app
        run: cargo tauri build
      - name: Self-test (download base model, transcribe the clip)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/mimir.exe -ArgumentList '--self-test','base' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err
          exit $p.ExitCode
      - name: Publish for testers
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || 'desktop-latest' }}
          name: Mimir for Windows (test build)
          prerelease: true
          body: |
            Test build of Mimir for Windows 10 and 11. It installs for your user only, without an admin password.
            When Windows SmartScreen warns, click "More info", then "Run anyway". The app is not signed yet.
            Mimir lives in the tray (bottom right, maybe under the ^ arrow). Settings opens on first launch so you can download the speech model.
          files: desktop/target/release/bundle/nsis/*.exe

  # Spike tools for friends (phase 1): uia-probe.exe and stt-bench.exe on a
  # GitHub prerelease, downloadable without a login. Runs on a tag
  # desktop-probes-v* or by hand.
  probes:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-probes-v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Portable whisper.cpp build (AVX2 baseline), not tuned to the runner.
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/desktop/ci/portable-cpu.cmake
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build the CPU tools
        shell: pwsh
        run: |
          cargo build --release -p uia-probe -p stt-bench
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/uia-probe.exe, target/release/stt-bench.exe out/
      - name: Install the Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.304.1
        run: |
          curl.exe -sSfL -o "$env:RUNNER_TEMP\vulkan-sdk.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe"
          & "$env:RUNNER_TEMP\vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"
      - name: Build the GPU bench
        shell: pwsh
        run: |
          cargo build --release -p stt-bench --features gpu
          Copy-Item target/release/stt-bench.exe out/stt-bench-gpu.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-probes-latest' }}
          name: Mimir for Windows — test tools
          prerelease: true
          body: |
            Two small test tools for the Windows version of Mimir. Neither one records, stores or uploads anything you type.
            1. **stt-bench.exe** measures how fast speech-to-text runs on your PC. It downloads about 760 MB once. Send the lines that start with RESULT, plus the CPU line.
            2. **stt-bench-gpu.exe** runs the same test on the video card (NVIDIA, AMD or Intel). Run it after stt-bench.exe; it reuses the same downloads. If it does not open, skip it. Send the RESULT lines and any line that starts with ggml_vulkan.
            3. **uia-probe.exe** checks what Windows exposes in text fields. Click into a text box in Notepad, Chrome, Slack, Teams/Discord and Word/Outlook, and type a few words in each. Send the table it prints.
            When Windows SmartScreen warns, click "More info", then "Run anyway". The tools are not signed.
          files: |
            desktop/out/uia-probe.exe
            desktop/out/stt-bench.exe
            desktop/out/stt-bench-gpu.exe
