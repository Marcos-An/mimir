[package]
name = "stt-bench"
version = "0.1.0"
edition.workspace = true
description = "Spike S2: how fast local Whisper (whisper.cpp) transcribes on this computer."

[dependencies]
whisper-rs = "0.14"
hound = "3"
ureq = "2"

[features]
# Builds stt-bench-gpu.exe: whisper.cpp on the video card through Vulkan
# (NVIDIA, AMD, Intel). Needs the Vulkan SDK at build time.
gpu = ["whisper-rs/vulkan"]
