[package]
name = "uia-probe"
version = "0.1.0"
edition.workspace = true
description = "Spike S1: what Windows UI Automation exposes in the focused text field. Prints no text."

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
] }
