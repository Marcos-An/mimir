[package]
name = "mimir-core"
version = "0.1.0"
edition.workspace = true
description = "Platform-neutral logic of Mimir (dictation cleanup, writing check, Claude requests)."

[dependencies]
fancy-regex = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
